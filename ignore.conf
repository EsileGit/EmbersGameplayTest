# Solution Visual Studio de la racine, regeneree a volonte par GenerateProjectFiles. Glob ANCRE :
# mesure, `/*.sln` fait bien passer le fichier de Private a ignore, et l'ancrage limite la regle a
# la racine (un .sln pose ailleurs resterait visible). La forme generique vaut aussi dans les
# projets derives, ou le fichier porte un AUTRE nom (EscapeStore.sln, PaperShredder.sln...).
/*.sln
#Sortie de la derniere compilation, reecrite entierement a chaque build sur chaque poste. Versionnee,
#elle entrait en conflit a chaque merge pour tout le monde, sans qu'aucune version ait de valeur.
/.claude/skills/ue-build/last-build.log
# Memoire que les agents ecrivent pour eux-memes, relue au demarrage de chaque role. Ignoree, et
# c'est un choix : chaque poste ecrit dans les MEMES fichiers a chaque session, donc les versionner
# fabriquerait a chaque merge les conflits .claude/ qu'on a passe le 2026-09-09 a arbitrer -- sur
# des notes que personne ne relit. Le partage a deja son canal, les skills, qui sont relus et
# ranges : une lecon qui merite de circuler y monte (c'est le metier du scribe), le reste reste
# local. Ancre avec un `/` de tete, sinon Plastic lit un NOM et n'ignore rien.
/.claude/agent-memory
